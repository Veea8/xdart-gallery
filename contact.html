<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — xdart gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .contact-content { max-width: 460px; }
    .contact-content h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 5vw, 4rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .contact-content p {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text2);
      margin-bottom: 36px;
    }
    .contact-email {
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      transition: border-color 0.2s, color 0.2s;
    }
    .contact-email:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-name">xdart <em>gallery</em></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-content">
      <div class="contact-content">
        <h1>Get in touch</h1>
        <p>
          For inquiries about artworks, exhibitions, or commissions, feel free to reach out.
        </p>
        <a class="contact-email" href="mailto:xdburckhardt@gmail.com">
          xdburckhardt@gmail.com
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> xdart gallery</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('nav-toggle').addEventListener('click', function () {
      this.classList.toggle('open');
      document.getElementById('site-nav').classList.toggle('open');
    });
  </script>
</body>
</html>
