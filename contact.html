<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — xdart gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .contact-content { max-width: 460px; }
    .contact-content h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 5vw, 4rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .contact-content p {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text2);
      margin-bottom: 36px;
    }
    .contact-email,
    .contact-social {
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      transition: border-color 0.2s, color 0.2s;
      display: inline-block;
    }
    .contact-email:hover,
    .contact-social:hover { color: var(--accent); border-color: var(--accent); }
    .social-links {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .social-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text2);
      display: block;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-name"><img src="images/logo.svg" alt="xdart gallery" /></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-content">
      <div class="contact-content">
        <h1>Get in touch</h1>
        <p>
          For inquiries about artworks, exhibitions, or commissions, feel free to reach out.
        </p>
        <a class="contact-email" href="mailto:info@xdart.ch">
          info@xdart.ch
        </a>

        <div class="social-links">
          <div>
            <span class="social-label">Instagram</span>
            <a class="contact-social" href="https://www.instagram.com/xdart.ch?utm_source=qr" target="_blank" rel="noopener">
              @xdart.ch
            </a>
          </div>
          <div>
            <span class="social-label">LinkedIn</span>
            <a class="contact-social" href="https://www.linkedin.com/company/xdart/?viewAsMember=true" target="_blank" rel="noopener">
              xdart
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <button class="scroll-top" id="scroll-top" aria-label="Back to top">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M3 10L8 5L13 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> xdart gallery</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
