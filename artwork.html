<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artwork — xdart gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/artwork.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="site-name"><img src="images/logo.svg" alt="xdart gallery" /></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="/">Gallery</a>
        <a href="about">About</a>
        <a href="contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-content">

      <a href="/" class="back-link" id="back-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to gallery
      </a>

      <div class="error-msg" id="error-msg" style="display:none">
        Artwork not found.
      </div>

      <div id="detail-content" style="display:none">
        <div class="artwork-detail">

          <div class="image-panel">
            <div class="main-image-wrap">
              <img id="main-img" src="" alt="" />
            </div>
            <div class="thumb-strip" id="thumb-strip">
              <img class="thumb" id="thumb-artwork" src="" alt="" title="Artwork photo" />
              <img class="thumb" id="thumb-room" src="" alt="" title="Room view" />
            </div>
          </div>

          <div class="details-panel">
            <h1 class="artwork-collection" id="artwork-collection"></h1>
            <p class="artwork-year" id="artwork-year"></p>
            <hr class="detail-divider" />
            <div class="detail-row">
              <span class="detail-label">Medium</span>
              <span class="detail-value" id="detail-medium"></span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Dimensions</span>
              <span class="detail-value" id="detail-dimensions"></span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <button class="scroll-top" id="scroll-top" aria-label="Back to top">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M3 10L8 5L13 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> xdart gallery &nbsp;·&nbsp; <a href="impressum">Impressum</a> &nbsp;·&nbsp; <a href="privacy">Privacy</a></p>
    <div class="footer-social">
      <a href="https://xdart.ch/" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        xdart.ch
      </a>
      <span class="footer-divider">·</span>
      <span class="footer-follow">Follow me on</span>
      <a href="https://www.instagram.com/xdart.ch?utm_source=qr" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
      <a href="https://www.linkedin.com/company/xdart/?viewAsMember=true" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M8 11v5"/><path d="M8 8v.01"/><path d="M12 16v-5"/><path d="M12 11a4 4 0 0 1 8 0v5"/></svg>
        LinkedIn
      </a>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/artwork.js"></script>
</body>
</html>
